# Matriz de versiones de GimCheck. Fuente: docs/analisis-tecnico.md §5, con la
# excepción de Kotlin: AGP 9.5.1 usa built-in Kotlin y solo soporta la KGP que trae
# (2.2.10); con 2.4.21 falla con NoClassDefFoundError BaseVariant. Ver docs/build.md.
# Cualquier cambio acá se refleja en docs/build.md.

[versions]
agp = "9.5.1"
kotlin = "2.2.10"
ksp = "2.3.14"
composeBom = "2026.09.00"
room = "2.8.5"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
# 1.9.0 y no 1.13.0: la 1.13 se publicó con metadata de Kotlin 2.4 y el compilador
# de acá es 2.2.10 (lo fija AGP 9.5.1), así que no puede leerla:
#   Module was compiled with an incompatible version of Kotlin. The binary version of
#   its metadata is 2.4.0, expected version is 2.2.0.
# Al subir Kotlin hay que volver a subir esta versión.
kotlinxSerialization = "1.9.0"
kotlinxDatetime = "0.8.0"
robolectric = "4.18"
junit = "4.13.2"
# androidx.test:core 1.7.0 (estable). Robolectric 4.18 ya trae monitor 1.8.0;
# core sólo se usa por ApplicationProvider/InstrumentationRegistry en los tests.
androidxTestCore = "1.7.0"
# Tests instrumentados (emulador de CI, GIM-44): runner + ext-junit + rules.
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# room-testing sólo en tests JVM (MigrationTestHelper); no hay emulador ni
# connectedAndroidTest en este proyecto (ver docs/build.md).
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
junit4 = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Plugin oficial de Room: es el que sabe exportar el schema cuando se procesa con
# KSP (escribe en build/ y copia a room.schemaDirectory). Sin él, Room no deja el
# JSON en app/schemas/ (ver docs/build.md).
androidx-room = { id = "androidx.room", version.ref = "room" }
