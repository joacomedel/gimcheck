# Memoria del daemon de Gradle. En CI (runner de 16 GB) sobra; el gate local del
# Moto pisa este valor con -Dorg.gradle.jvmargs=-Xmx768m (ver scripts/check-core.sh).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
