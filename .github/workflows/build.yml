name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: :core:test + :app:test + lint + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (caché)
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK (platform 37.0 + build-tools 36.0.0/37.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      - name: Tests de dominio (:core, JVM puro)
        run: ./gradlew :core:test --stacktrace

      - name: Tests unitarios de :app (JVM, sin emulador)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (:app)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # El schema exportado por Room (app/schemas/) se commitea: es el contrato
      # que valida MigrationTestHelper. Si el generado difiere del commiteado,
      # falta commitear el bump (ver docs/adr/0003-persistencia-room.md).
      - name: Schema de Room commiteado (efímero: se baja como artefacto)
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 7

      - name: Publicar artifact gimcheck-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: gimcheck-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Reportes de tests (sólo si algo falló)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gimcheck-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
