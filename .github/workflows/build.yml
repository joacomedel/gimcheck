name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: :core:test + :app:test + lint + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (caché)
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK (platform 37.0 + build-tools 36.0.0/37.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      # Robolectric baja `android-all-instrumented` desde Maven en la primera corrida
      # (MavenArtifactFetcher), no por Gradle: sin este caché cada key nueva de
      # gradle/actions lo vuelve a descargar, y un solo 5xx/timeout deja el job rojo por
      # red y no por código. La key va por versión de Robolectric (subirla invalida).
      # El primer run con caché fría puede fallar; el reintento baja en caliente.
      - name: Caché de Robolectric (android-all-instrumented)
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.18-android-all-${{ runner.os }}-v1
          restore-keys: |
            robolectric-4.18-

      - name: Tests de dominio (:core, JVM puro)
        run: ./gradlew :core:test --stacktrace

      - name: Tests unitarios de :app (JVM, sin emulador)
        # Dos intentos: en caché fría Robolectric descarga `android-all-instrumented` y un
        # timeout de red no significa que el código esté mal. Un test realmente rojo falla
        # igual en el reintento (que ya no toca la red) y el job queda rojo.
        run: |
          if ./gradlew :app:testDebugUnitTest --stacktrace; then
            exit 0
          fi
          echo "::warning::La primera corrida falló; reintento (Robolectric: descarga en frío o test rojo real)"
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (:app)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # El schema exportado por Room (app/schemas/) se commitea: es el contrato
      # que valida MigrationTestHelper. Si el generado difiere del commiteado,
      # falta commitear el bump del esquema (ADR 0003).
      - name: Schema de Room commiteado
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::El schema de Room generado no coincide con app/schemas/ commiteado."
            git status --porcelain -- app/schemas
            git --no-pager diff -- app/schemas
            exit 1
          fi
          echo "app/schemas/ al día"

      - name: Publicar artifact gimcheck-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: gimcheck-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Reportes de tests (sólo si algo falló)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gimcheck-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # Verificación en Android real del aviso de fin de descanso (GIM-44). Es el único
  # lugar donde se puede probar que el overlay SYSTEM_ALERT_WINDOW se dibuja encima de
  # OTRA app y que la alarma exacta despierta el receptor con el proceso sin UI. La JVM
  # (Robolectric) verifica la política y la notificación, no el compositor del sistema.
  instrumented:
    name: Aviso de fin de descanso en emulador (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (caché)
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK (platform 37.0 + build-tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      # El runner necesita /dev/kvm para arrancar el emulador x86_64 con aceleración.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + tests instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Resultados instrumentados (siempre)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gimcheck-instrumented-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
